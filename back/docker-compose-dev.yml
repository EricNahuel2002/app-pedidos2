services:

  mysql:
    image: mysql:latest
    environment:
      MYSQL_USER : admin
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: masterdb
      MYSQL_ROOT_PASSWORD: root
    ports:
        - "3307:3306"
    volumes:
        - mysql-data:/var/lib/mysql
        - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
        - pedidos-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uadmin", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  apigateway:
    image: ${DOCKER_REGISTRY-}apigateway
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
      target: dev
    ports:
        - "5000:5000"
    container_name: ApiGateway
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      ASPNETCORE_ENVIRONMENT: "Development"
      Jwt__Key: "FJ39dk20slA9sLq93KDlq02Lskf92KDl"
      Jwt__Issuer: "auth-api"
      Jwt__Audience: "api-gateway"
    volumes:
        - ./src/ApiGateway:/app
        - nuget-cache:/root/.nuget/packages
        - /app/bin
        - /app/obj
    command:
        bash -c "dotnet watch run --project /app/ApiGateway.csproj --no-launch-profile"
    depends_on:
      - auth
      - menus
      - notificaciones
      - ordenes
      - usuarios
    networks:
        - pedidos-net
    

  menus:
    image: ${DOCKER_REGISTRY-}menus
    build:
      context: .
      dockerfile: src/Menus/Dockerfile
      target: dev
    ports:
        - "5001:5000"
    container_name: Menus
    networks:
        - pedidos-net
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=db_menus;User=admin;Password=root;SslMode=None;"
      ASPNETCORE_URLS: "http://+:5000"
      ASPNETCORE_ENVIRONMENT: "Development"
      Jwt__Key: "FJ39dk20slA9sLq93KDlq02Lskf92KDl"
      Jwt__Issuer: "auth-api"
      Jwt__Audience: "api-gateway"
    volumes:
        - ./src/Menus:/app
        - nuget-cache:/root/.nuget/packages
        - /app/bin
        - /app/obj
    command:
        bash -c "dotnet watch run --project /app/Menus.csproj --no-launch-profile"
    depends_on:
        mysql:
            condition: service_healthy


  notificaciones:
    image: ${DOCKER_REGISTRY-}notificaciones
    build:
      context: .
      dockerfile: src/Notificaciones/Dockerfile
      target: dev
    ports:
        - "5002:5000"
    container_name: Notificaciones
    networks:
        - pedidos-net
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=db_notificaciones;User=admin;Password=root;SslMode=None;"
      ASPNETCORE_URLS: "http://+:5000"
      ASPNETCORE_ENVIRONMENT: "Development"
      Jwt__Key: "FJ39dk20slA9sLq93KDlq02Lskf92KDl"
      Jwt__Issuer: "auth-api"
      Jwt__Audience: "api-gateway"
    volumes:
        - ./src/Notificaciones:/app
        - nuget-cache:/root/.nuget/packages
        - /app/bin
        - /app/obj
    command:
        bash -c "dotnet watch run --project /app/Notificaciones.csproj --no-launch-profile"
    depends_on:
        mysql:
            condition: service_healthy

  ordenes:
    image: ${DOCKER_REGISTRY-}ordenes
    build:
      context: .
      dockerfile: src/Ordenes/Dockerfile
      target: dev
    ports:
        - "5003:5000"
    container_name: Ordenes
    networks:
        - pedidos-net
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=db_ordenes;User=admin;Password=root;SslMode=None;"
      ASPNETCORE_URLS: "http://+:5000"
      ASPNETCORE_ENVIRONMENT: "Development"
      Jwt__Key: "FJ39dk20slA9sLq93KDlq02Lskf92KDl"
      Jwt__Issuer: "auth-api"
      Jwt__Audience: "api-gateway"
    volumes:
        - ./src/Ordenes:/app
        - nuget-cache:/root/.nuget/packages
        - /app/bin
        - /app/obj
    command:
        bash -c "dotnet watch run --project /app/Ordenes.csproj --no-launch-profile"
    depends_on:
        mysql:
            condition: service_healthy

  usuarios:
    image: ${DOCKER_REGISTRY-}usuarios
    build:
      context: .
      dockerfile: src/Usuarios/Dockerfile
      target: dev
    ports:
       - "5004:5000"
    container_name: Usuarios
    networks:
        - pedidos-net
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=db_usuarios;User=admin;Password=root;SslMode=None;"
      ASPNETCORE_URLS: "http://+:5000"
      ASPNETCORE_ENVIRONMENT: "Development"
    volumes:
        - ./src/Usuarios:/app
        - nuget-cache:/root/.nuget/packages
        - /app/bin
        - /app/obj
    command:
        bash -c "dotnet watch run --project /app/Usuarios.csproj --no-launch-profile"
    depends_on:
        mysql:
            condition: service_healthy

  auth:
    image: ${DOCKER_REGISTRY-}auth
    build:
      context: .
      dockerfile: src/Auth/Dockerfile
      target: dev
    ports:
       - "5005:5000"
    container_name: Auth
    networks:
        - pedidos-net
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      ASPNETCORE_ENVIRONMENT: "Development"
      Jwt__Key: "FJ39dk20slA9sLq93KDlq02Lskf92KDl"
      Jwt__Issuer: "auth-api"
      Jwt__Audience: "api-gateway"
    volumes:
        - ./src/Auth:/app
        - nuget-cache:/root/.nuget/packages
        - /app/bin
        - /app/obj
    command:
        bash -c "dotnet watch run --project /app/Auth.csproj --no-launch-profile"
    depends_on:
        - usuarios

networks:
    pedidos-net:
        
volumes:
    mysql-data:
    nuget-cache: